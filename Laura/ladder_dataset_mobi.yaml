
# Adapted from pbe.yaml. LiDAR/range removed.

use_camera: True
use_lidar: False

image_height: 512
image_width: 512
latent_size: 64 # image_width // 8

batch_size: 2 # keep at 2; dataset is small
num_workers_per_gpu: 4

# No range view — depth conditioning comes from 3-D bbox corners only
range_object_norm: False
range_object_norm_scale: 0.75
range_int_norm: False

conditions:
  - ref_image

model:
  base_learning_rate: 8.0e-05
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: "inpaint"
    cond_stage_key: ${conditions}
    image_size: ${latent_size}
    channels: 4
    cond_stage_trainable: true
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    u_cond_percent: 0.2
    scale_factor: 0.18215
    use_ema: False
    use_camera: ${use_camera}
    use_lidar: ${use_lidar}

    # keep range_* flags so the model code doesn't crash
    range_object_norm: ${range_object_norm}
    range_object_norm_scale: ${range_object_norm_scale}
    range_int_norm: ${range_int_norm}
    lidar_scale_factor: 0.18215 # unused but expected by LatentDiffusion ctor

    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [ 100 ] # shorter warmup — small dataset
        cycle_lengths: [ 10000000000000 ]
        f_start: [ 1.e-6 ]
        f_max: [ 1. ]
        f_min: [ 1. ]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: ${latent_size}
        in_channels: 9 # 4 (noisy latent) + 4 (masked latent) + 1 (mask)
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: False
        legacy: False
        add_conv_in_front_of_unet: False
        bbox_cond: True
        use_camera: ${use_camera}
        use_lidar: ${use_lidar}

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: ${image_height}
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [ 1, 2, 4, 4 ]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPImageEmbedder
      params:
        conditions: ${conditions}

# Data
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: ${batch_size}
    num_workers_per_gpu: ${num_workers_per_gpu}
    wrap: False

    train:
      target: ladder_dataset_mobi.LadderDatasetTrain
      params:
        csv_path: MoBI_outputs/ladder_segmentations_real_size3/ladder_instances.csv   # HARDCODED!
        image_height: ${image_height}
        image_width: ${image_width}
        expand_mask_ratio: 0.12 # slightly wider inpaint zone than mask
        ref_aug: True
        object_area_crop: 0.2
        num_samples_per_epoch: 2000 # virtual epoch length; oversample small dataset
        min_sam2_score: 0.6
        val_split: 0.15
        # Camera intrinsics — replace with values from calibration file.
        # fx: null
        # fy: null
        # cx: null
        # cy: null

    validation:
      target: ladder_dataset_mobi.LadderDatasetVal
      params:
        csv_path: MoBI_outputs/ladder_segmentations_real_size3/ladder_instances.csv  # same file, val split
        image_height: ${image_height}
        image_width: ${image_width}
        expand_mask_ratio: 0.12
        ref_aug: False
        object_area_crop: 0.2
        num_samples_per_epoch: 64
        min_sam2_score: 0.6
        val_split: 0.15
        # Camera intrinsics — same as train
        # fx: null
        # fy: null
        # cx: null
        # cy: null

# Training
lightning:
  trainer:
    max_epochs: 60 # more epochs to compensate for small dataset
    num_nodes: 1
    accelerator: 'cpu'
